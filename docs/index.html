<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Pong RL Agent Demo (Player vs AI)</title>
    <link rel="stylesheet" href="style.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
</head>
<body>
    <div class="container">
        <h1>Pong RL</h1>
        <div id="status" class="status-box">Loading resources...</div>
        <canvas id="pongCanvas"></canvas>
        <div class="controls">
            <button id="startButton">Start / Resume</button>
            <button id="resetButton" disabled>Reset Game</button>
        </div>
        <div class="difficulty-control">
            <label for="difficultySlider">Difficulty:</label>
            <input type="range" id="difficultySlider" name="difficulty" min="0.1" max="2.0" step="0.1" value="1.0">
            <span id="difficultyValue">1.0x</span>
        </div>
        <div class="touch-controls">
            <button id="touchUpButton" class="touch-button">▲ UP</button>
            <button id="touchDownButton" class="touch-button">▼ DOWN</button>
        </div>
        <div class="scores">
            <div class="score-item">AI Score: <span id="aiScore">0</span></div>
            <div class="score-item">Your Score: <span id="playerScore">0</span></div>
        </div>
        <div class="instructions">
            Use 'W'/'S' or Touch Buttons to control the right paddle.
            <br>
            Adjust Difficulty slider for faster/slower game dynamics.
            <br>
            Space=Start/Pause, R=Reset.
        </div>
        <div class="footer">
            Agent trained using DQN. Play against it!
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/onnxruntime-web/dist/ort.min.js"></script>

    <script src="pong_env.js"></script>
    <script src="agent.js"></script>
    <script src="app.js"></script>
</body>
</html>
